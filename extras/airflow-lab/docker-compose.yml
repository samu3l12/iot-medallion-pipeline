# ============================================================
# Docker Compose - Entorno Airflow + Jupyter
# ============================================================
# Este archivo levanta un entorno completo con:
#   - Apache Airflow (webserver + scheduler + init)
#   - JupyterLab
# Ambos servicios comparten carpetas de DAGs, notebooks y output.
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__PAGINATION_ITEM_COUNT: 100
    _PIP_ADDITIONAL_REQUIREMENTS: ''
  volumes:
    - ./dags:/opt/airflow/dags
    - ./notebooks:/opt/airflow/notebooks
    - ./output:/opt/airflow/output
    - airflow-logs:/opt/airflow/logs
    - airflow-db:/opt/airflow/db
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # -------------------------------------------------------
  # Inicialización de Airflow: crea la BD y el usuario admin
  # -------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-initV1
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "Airflow init completed!"
    restart: "no"

  # -------------------------------------------------------
  # Airflow Webserver: interfaz web en http://localhost:8080
  # -------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserverV1
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------
  # Airflow Scheduler: ejecuta los DAGs programados
  # -------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-schedulerV1
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------
  # JupyterLab: entorno de notebooks en http://localhost:8888
  # Comparte volúmenes con Airflow para acceder a DAGs y notebooks
  # También tiene Airflow instalado para poder usar la CLI
  # -------------------------------------------------------
  jupyter:
    <<: *airflow-common
    container_name: jupyterV1
    environment:
      <<: *airflow-common-env
      JUPYTER_IP: "0.0.0.0"
    command: >
      bash -c "
        jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --ServerApp.token='airflow'
        --ServerApp.password=''
        --notebook-dir=/opt/airflow/notebooks
        --allow-root
      "
    ports:
      - "8888:8888"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-logs:
  airflow-db:
